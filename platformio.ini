[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -Wall
lib_deps =
    nrf24/RF24@^1.5.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
lib_ldf_mode = chain+
board_build.partitions = min_spiffs.csv
